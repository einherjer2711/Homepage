<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Uhr, 5 nach 5">
  <!-- pastfive-Logo: Uhr auf 17:05 – fünf nach fünf, Feierabend! -->
  <defs>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffb347"/>
      <stop offset="1" stop-color="#ff6f61"/>
    </linearGradient>
  </defs>
  <circle cx="50" cy="50" r="46" fill="url(#rim)"/>
  <circle cx="50" cy="50" r="38" fill="#fff8ec"/>
  <!-- Stundenpunkte -->
  <g fill="#e8d9c2">
    <circle cx="50" cy="17" r="2.6"/><circle cx="83" cy="50" r="2.6"/>
    <circle cx="50" cy="83" r="2.6"/><circle cx="17" cy="50" r="2.6"/>
    <circle cx="33.5" cy="21.4" r="1.8"/><circle cx="21.4" cy="33.5" r="1.8"/>
    <circle cx="21.4" cy="66.5" r="1.8"/><circle cx="33.5" cy="78.6" r="1.8"/>
    <circle cx="78.6" cy="33.5" r="1.8"/><circle cx="78.6" cy="66.5" r="1.8"/>
  </g>
  <!-- die beiden "Fünfen": 1 (=5 Minuten) und 5 Uhr -->
  <circle cx="66.5" cy="21.4" r="3.4" fill="#ff8a3d"/>
  <circle cx="66.5" cy="78.6" r="3.4" fill="#ff8a3d"/>
  <!-- Zeiger: Stunde knapp nach 5, Minute auf 1 -->
  <line x1="50" y1="50" x2="59.2" y2="67.7" stroke="#4a3b5c" stroke-width="6" stroke-linecap="round"/>
  <line x1="50" y1="50" x2="64.5" y2="25" stroke="#4a3b5c" stroke-width="4" stroke-linecap="round"/>
  <circle cx="50" cy="50" r="4.5" fill="#ff6f61" stroke="#4a3b5c" stroke-width="2"/>
</svg>
