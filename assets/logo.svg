<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="pastfive">
  <!-- pastfive-Logo "Abendsonne": untergehende Sonne als Uhr auf fünf nach fünf -->
  <defs>
    <linearGradient id="pf-sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffa24a"/>
      <stop offset="1" stop-color="#f2762e"/>
    </linearGradient>
    <mask id="pf-horizon">
      <rect width="100" height="100" fill="#fff"/>
      <rect y="77" width="100" height="4" fill="#000"/>
      <rect y="85" width="100" height="3" fill="#000"/>
    </mask>
  </defs>
  <circle cx="50" cy="50" r="42" fill="url(#pf-sun)" mask="url(#pf-horizon)"/>
  <g stroke="#fff" stroke-linecap="round">
    <line x1="50" y1="21" x2="50" y2="16" stroke-width="3.5"/>
    <line x1="79" y1="50" x2="84" y2="50" stroke-width="3.5"/>
    <line x1="21" y1="50" x2="16" y2="50" stroke-width="3.5"/>
    <line x1="50" y1="50" x2="56.5" y2="62.4" stroke-width="7"/>
    <line x1="50" y1="50" x2="63" y2="27.5" stroke-width="4.5"/>
  </g>
  <circle cx="50" cy="50" r="4" fill="#fff"/>
</svg>
