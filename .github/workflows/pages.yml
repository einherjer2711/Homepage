# Veröffentlicht die Website auf GitHub Pages – und legt dabei automatisch die neuesten
# Spiele-Apps aus den Releases der Spiele-Repos dazu. WELCHE Spiele: steht in spiele.json
# (ein Eintrag pro Spiel). Pro Spiel entsteht:
#   download/<kurz>/<APK> + version.json   (Download + Update-Prüfung der App)
#   screens/<kurz>/*.webp                   (Bildschirmfotos, verkleinert)
#   assets/<kurz>/icon.png                  (App-Symbol, wenn "symbol": true)
#   <kurz>/spielen/                         (iPhone-Version im Browser, wenn "webapp": true – aus Web-App.zip)
#
# Wann läuft das?
#   • bei jeder Änderung auf "main"
#   • per Knopf: Actions → "Website veröffentlichen" → Run workflow
#   • von den Spiele-Repos nach jedem Release (Sofort-Anstoß mit HOMEPAGE_TOKEN, siehe ANLEITUNG-WEBSITE.md 3b)
#   • jede Stunde als Reserve: prüft, ob es eine neue App-Version gibt (sonst passiert nichts)
#
# Benötigtes Secret (Settings → Secrets and variables → Actions):
#   GAMES_TOKEN – Fine-grained Token, NUR für die Spiele-Repos aus spiele.json, NUR "Contents: Read-only".
#   Fehlt es, wird die Website trotzdem veröffentlicht – nur ohne App-Downloads.
#
# Sicherheit: Eine APK wird nur übernommen, wenn sie mit DEINEM jeweiligen App-Schlüssel signiert ist.
# Die APKs landen nie im Repo, sondern nur in der veröffentlichten Website.
name: Website veröffentlichen

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deploy1.outputs.page_url || steps.deploy2.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5
        id: pages

      - name: Neueste App-Versionen suchen
        id: apps
        env:
          GH_TOKEN: ${{ secrets.GAMES_TOKEN }}
          SITE: ${{ steps.pages.outputs.base_url }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::Secret GAMES_TOKEN fehlt – die Website wird ohne App-Downloads veröffentlicht."
            echo "have=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          : > "$RUNNER_TEMP/tags.txt"; GLEICH=true
          for i in $(seq 0 $(( $(jq length spiele.json) - 1 ))); do
            KURZ=$(jq -r ".[$i].kurz" spiele.json); REPO=$(jq -r ".[$i].repo" spiele.json)
            TAG=$(gh release view --repo "$REPO" --json tagName -q .tagName)
            LIVE=$(curl -fsSL "$SITE/download/$KURZ/version.json?t=$(date +%s)" 2>/dev/null | jq -r '.versionName // empty' 2>/dev/null || true)
            echo "$KURZ: neueste $TAG · auf der Website ${LIVE:-keine}"
            echo "$KURZ $TAG" >> "$RUNNER_TEMP/tags.txt"
            [ "v$LIVE" = "$TAG" ] || GLEICH=false
          done
          echo "have=true" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$GLEICH" = true ]; then
            echo "Nichts Neues – Website bleibt, wie sie ist."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Website zusammenstellen
        if: steps.apps.outputs.skip != 'true'
        run: |
          mkdir _site
          # alles außer Anleitungen (.md), Git- und Workflow-Dateien und der Spiele-Liste
          rsync -a --exclude '.git*' --exclude '_site' --exclude '*.md' --exclude 'spiele.json' ./ _site/

      - name: Spiele holen und prüfen (APK, version.json)
        if: steps.apps.outputs.skip != 'true' && steps.apps.outputs.have == 'true'
        env:
          GH_TOKEN: ${{ secrets.GAMES_TOKEN }}
        run: |
          for i in $(seq 0 $(( $(jq length spiele.json) - 1 ))); do
            KURZ=$(jq -r ".[$i].kurz" spiele.json); REPO=$(jq -r ".[$i].repo" spiele.json)
            APK=$(jq -r ".[$i].apk" spiele.json); FP=$(jq -r ".[$i].fingerabdruck" spiele.json)
            TAG=$(grep "^$KURZ " "$RUNNER_TEMP/tags.txt" | cut -d' ' -f2)
            D=_site/download/$KURZ
            echo "::group::$KURZ $TAG"
            mkdir -p "$D"
            gh release download "$TAG" --repo "$REPO" --pattern "$APK" --dir "$D"
            # Nur APKs mit dem echten App-Schlüssel des Spiels werden veröffentlicht
            bash .github/scripts/signatur-pruefen.sh "$D/$APK" "$FP"
            if gh release download "$TAG" --repo "$REPO" --pattern 'version.json' --dir "$D" 2>/dev/null; then
              jq -e --arg apk "$APK" '(.versionCode|type=="number") and (.apk==$apk)' "$D/version.json" > /dev/null \
                || { echo "::error::$KURZ: version.json ist ungültig."; exit 1; }
              [ "v$(jq -r .versionName "$D/version.json")" = "$TAG" ] \
                || { echo "::error::$KURZ: version.json passt nicht zu $TAG."; exit 1; }
            else
              # Ältere Releases ohne version.json: nur für die Anzeige auf der Website erzeugen
              gh release view "$TAG" --repo "$REPO" --json tagName,publishedAt,body | jq --arg apk "$APK" '{
                  versionName: (.tagName | ltrimstr("v")), apk: $apk, date: (.publishedAt[0:10]),
                  notes: [ .body | (capture("Änderung: (?<n>[^\n]+)") | .n)? ] }' > "$D/version.json"
            fi
            cat "$D/version.json"
            echo "::endgroup::"
          done

      - name: Bildschirmfotos und App-Symbole holen
        # Bilder sind eine Zugabe: Fehlt etwas, wird die Website trotzdem veröffentlicht
        # (auf der Seite verschwinden dann nur die fehlenden Bilder).
        if: steps.apps.outputs.skip != 'true' && steps.apps.outputs.have == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GAMES_TOKEN }}
        run: |
          sudo apt-get install -y -qq webp > /dev/null
          T=$(mktemp -d)
          for i in $(seq 0 $(( $(jq length spiele.json) - 1 ))); do
            KURZ=$(jq -r ".[$i].kurz" spiele.json); REPO=$(jq -r ".[$i].repo" spiele.json)
            MUSTER=$(jq -r ".[$i].bilder // \"bild-*.png\"" spiele.json); W=$(jq -r ".[$i].bildbreite // 540" spiele.json)
            SYMBOL=$(jq -r ".[$i].symbol // true" spiele.json)
            TAG=$(grep "^$KURZ " "$RUNNER_TEMP/tags.txt" | cut -d' ' -f2)
            mkdir -p "$T/$KURZ" "_site/screens/$KURZ"
            gh release download "$TAG" --repo "$REPO" --pattern "$MUSTER" --dir "$T/$KURZ" \
              || echo "::warning::$KURZ: keine Bildschirmfotos im Release $TAG"
            for f in "$T/$KURZ"/*.png; do
              [ -e "$f" ] || continue
              cwebp -quiet -q 80 -resize "$W" 0 "$f" -o "_site/screens/$KURZ/$(basename "${f%.png}").webp"
            done
            if [ "$SYMBOL" = "true" ] && gh release download "$TAG" --repo "$REPO" --pattern 'app-symbol-512.png' --dir "$T/$KURZ-symbol" 2>/dev/null; then
              mkdir -p "_site/assets/$KURZ"; cp "$T/$KURZ-symbol/app-symbol-512.png" "_site/assets/$KURZ/icon.png"
            fi
          done
          du -sh _site/screens/* 2>/dev/null; ls _site/screens/* 2>/dev/null

      - name: iPhone-Versionen holen (Web-App → <kurz>/spielen/)
        # Ebenfalls eine Zugabe: Fehlt sie, bleibt nur die iPhone-Seite weg, die Website erscheint trotzdem.
        # Übernommen wird nur ein Paket mit genau den erwarteten Dateien und passender Versionsnummer.
        if: steps.apps.outputs.skip != 'true' && steps.apps.outputs.have == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GAMES_TOKEN }}
        run: |
          T=$(mktemp -d)
          ERWARTET="icon-180.png icon-192.png icon-512.png index.html manifest.webmanifest sw.js"
          for i in $(seq 0 $(( $(jq length spiele.json) - 1 ))); do
            [ "$(jq -r ".[$i].webapp // false" spiele.json)" = "true" ] || continue
            KURZ=$(jq -r ".[$i].kurz" spiele.json); REPO=$(jq -r ".[$i].repo" spiele.json)
            TAG=$(grep "^$KURZ " "$RUNNER_TEMP/tags.txt" | cut -d' ' -f2)
            if ! gh release download "$TAG" --repo "$REPO" --pattern 'Web-App.zip' --dir "$T/$KURZ"; then
              echo "::warning::$KURZ: keine Web-App.zip im Release $TAG – iPhone-Version fehlt diesmal."; continue
            fi
            LISTE=$(unzip -Z1 "$T/$KURZ/Web-App.zip" | sort | xargs)
            if [ "$LISTE" != "$ERWARTET" ]; then
              echo "::warning::$KURZ: Web-App.zip enthält unerwartete Dateien ($LISTE) – nicht übernommen."; continue
            fi
            Z="_site/$KURZ/spielen"; rm -rf "$Z"; mkdir -p "$Z"
            unzip -q "$T/$KURZ/Web-App.zip" -d "$Z"
            if ! grep -q "APP_VERSION = '${TAG#v}'" "$Z/index.html"; then
              echo "::warning::$KURZ: Web-App passt nicht zu $TAG – nicht übernommen."; rm -rf "$Z"; continue
            fi
            echo "$KURZ: iPhone-Version $TAG unter /$KURZ/spielen/"
          done

      - uses: actions/upload-pages-artifact@v3
        if: steps.apps.outputs.skip != 'true'
        with:
          path: _site

      # GitHub meldet manchmal direkt nach dem Hochladen „Paket nicht gefunden“ –
      # dann kurz warten und ein zweites Mal versuchen.
      - name: Veröffentlichen
        if: steps.apps.outputs.skip != 'true'
        id: deploy1
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: Kurz warten (nur falls der erste Versuch scheiterte)
        if: steps.apps.outputs.skip != 'true' && steps.deploy1.outcome == 'failure'
        run: sleep 30

      - name: Veröffentlichen (zweiter Versuch)
        if: steps.apps.outputs.skip != 'true' && steps.deploy1.outcome == 'failure'
        id: deploy2
        uses: actions/deploy-pages@v4
