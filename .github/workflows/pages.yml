# Veröffentlicht die Website automatisch auf GitHub Pages,
# sobald sich etwas auf "main" ändert (oder per Knopf unter Actions → "Website veröffentlichen" → Run workflow).
name: Website veröffentlichen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Website zusammenstellen
        run: |
          mkdir _site
          # alles außer Anleitungen (.md), Git- und Workflow-Dateien
          rsync -a --exclude '.git*' --exclude '_site' --exclude '*.md' ./ _site/
          ls -R _site | head -50

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Veröffentlichen
        id: deployment
        uses: actions/deploy-pages@v4
